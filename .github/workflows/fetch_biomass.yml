name: Fetch Biomass
on:
  schedule:
    - cron: '0 6 20 * *'  # 20th each month at 06:00 UTC. Fiskeridirektoratet
      # publishes biostat-total-omr.json on the 20th - observed Last-Modified
      # Thu, 20 Aug 2026 04:38 GMT - so waiting for the 21st put every
      # downstream report a full day behind the rest of the market.
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas google-cloud-bigquery db-dtypes
      - name: Run fetch_biomass.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python fetch_biomass.py
