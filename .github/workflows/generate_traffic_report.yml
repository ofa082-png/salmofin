name: Generate Traffic Report
on:
  schedule:
    - cron: '15 7 * * *'  # after generate_report.yml and after the vessel/harvest fetch jobs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install google-cloud-bigquery google-auth
      - name: Generate traffic report
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python generate_traffic_report.py
      - name: Commit updated report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update traffic report
          file_pattern: docs/traffic.html
          # rebase before pushing: the report generators all commit to main and
          # their 5-minute stagger is shorter than their runtime, so without this
          # whichever finishes second is rejected as non-fast-forward.
          pull: '--rebase --autostash'
