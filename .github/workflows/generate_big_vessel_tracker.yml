name: Generate Big Vessel Tracker
on:
  schedule:
    - cron: '25 7 * * *'  # after generate_traffic_report.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install google-cloud-bigquery google-auth
      - name: Generate big vessel tracker
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python generate_big_vessel_tracker.py
      - name: Commit updated tracker
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update big vessel tracker
          file_pattern: docs/big_vessels.html
          # rebase before pushing: the report generators all commit to main and
          # their 5-minute stagger is shorter than their runtime, so without this
          # whichever finishes second is rejected as non-fast-forward.
          pull: '--rebase --autostash'
