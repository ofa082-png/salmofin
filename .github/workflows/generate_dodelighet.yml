name: Generate Dodelighet Report
on:
  schedule:
    - cron: '10 7 * * *'  # after the nightly fetch jobs have landed, staggered from the other generate_* jobs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install google-cloud-bigquery google-auth
      - name: Generate report
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python generate_dodelighet.py
      - name: Commit updated report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update dodelighet report
          file_pattern: docs/dodelighet.html
